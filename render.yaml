# Render Blueprint - lets Render set up the service from this repo directly.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: playcaller
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    # Secrets live in Render's dashboard, NOT in git (.env is gitignored
    # and never deployed). `sync: false` = Render prompts for the value
    # when the blueprint is applied and stores it server-side only.
    envVars:
      # Full training needs more memory than the free web instance offers.
      # Refresh locally and deploy the model, or enable on a larger instance.
      - key: NFL_DATA_REFRESH_ENABLED
        value: "0"
      - key: ANTHROPIC_API_KEY
        sync: false
