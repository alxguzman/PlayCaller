name: Refresh NFL model

on:
  schedule:
    - cron: '0 9 * * 2'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-nfl-model
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Only the explicit pipeline command trains; API smoke tests do not.
      NFL_DATA_REFRESH_ENABLED: '0'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-deploy.txt

      - name: Install pipeline and API dependencies
        run: python -m pip install -r requirements-deploy.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Download current data, train, and rebuild scorecard
        env:
          NFLVERSE_GITHUB_TOKEN: ${{ github.token }}
        run: python -m src.data.refresh --update-model

      - name: Verify the saved model serves recommendations
        run: |
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from src.api.main import app

          with TestClient(app) as client:
              status = client.get('/data/status').raise_for_status().json()
              scorecard = client.get('/season-scorecard').raise_for_status().json()
              assert scorecard['available']
              assert scorecard['season'] == status['model_season']
              client.post('/recommend', json={
                  'posteam': 'KC', 'defteam': 'BUF', 'down': 3, 'ydstogo': 7,
                  'yardline_100': 40, 'qtr': 2, 'game_seconds_remaining': 1800,
                  'score_differential': 0,
              }).raise_for_status()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Model refresh verified\n\n')
              summary.write(f"Season: {status['model_season']}; week: {status['model_week']}\n\n")
              summary.write(f"Data through: {status['model_data_through']}\n\n")
              summary.write('Training and inference checks passed.\n')
          PY

      - name: Commit and publish model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- model/play_success_model.joblib model/season_scorecard.json
          if git diff --cached --quiet; then
            echo "No model artifact changes to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Update NFL model and season scorecard"
          # A concurrent main-branch change rejects this push. Never force-push
          # or silently merge models trained against a different source revision.
          git push origin HEAD:main
          echo "Published model artifacts to main. Render's On Commit auto-deploy can now deploy them." >> "$GITHUB_STEP_SUMMARY"
